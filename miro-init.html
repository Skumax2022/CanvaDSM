<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- Подключаем официальный SDK Miro v2 -->
  <script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
</head>
<body>
  <script>
    async function init() {
      // Слушаем клик по иконке твоего ONED на панели Miro
      miro.board.ui.on('icon:click', async () => {
        // Открываем твою утилиту в интерактивном окне поверх доски
        await miro.board.ui.openModal({
          url: 'index.html',
          width: 1400,
          height: 900,
          fullscreen: false // Поставь true, если нужно открывать сразу во весь экран
        });
      });
    }
    init();
  </script>
</body>
</html>
