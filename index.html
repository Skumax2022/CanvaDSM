<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canvas + DSM — System Designer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a0a;
      --bg-elevated: #111111;
      --fg: #fafafa;
      --card: #141414;
      --plate: #1a1a1a;
      --border: rgba(255, 255, 255, 0.14);
      --border-strong: rgba(255, 255, 255, 0.28);
      --muted: #737373;
      --primary: #ffffff;
      --primary-dim: rgba(255, 255, 255, 0.08);
      --destructive: #f87171;
      --radius: 12px;
      --radius-plate: 18px;
      --font: "Segoe UI", ui-sans-serif, system-ui, -apple-system, sans-serif;
      --font-mono: ui-monospace, "Cascadia Code", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    button { font: inherit; cursor: pointer; background: none; border: none; color: inherit; }
    kbd {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 1px 4px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
    }
    .app { display: flex; flex-direction: column; height: 100vh; }
    .header {
      display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
      padding: 8px 14px; border-bottom: 1px solid var(--border);
      background: rgba(10, 10, 10, 0.92); backdrop-filter: blur(10px); z-index: 10;
    }
    .logo {
      width: 32px; height: 32px; border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-elevated); color: var(--primary);
      display: grid; place-items: center; font-weight: 700; font-size: 14px;
    }
    .breadcrumb { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 13px; }
    .link-btn { color: var(--fg); padding: 2px 6px; border-radius: 4px; opacity: 0.85; }
    .link-btn:hover { background: var(--primary-dim); opacity: 1; text-decoration: underline; }
    .view-switch {
      display: flex; gap: 2px; padding: 3px;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg-elevated);
    }
    .view-switch button {
      padding: 6px 14px; border-radius: 9px; font-size: 12px;
      font-weight: 500; letter-spacing: 0.02em; color: var(--muted);
      transition: background 0.12s, color 0.12s;
    }
    .view-switch button.active {
      background: var(--primary); color: #0a0a0a;
    }
    .view-switch button:not(.active):hover { color: var(--fg); background: var(--primary-dim); }
    .main { display: flex; flex: 1; min-height: 0; }
    .panel { min-width: 0; min-height: 0; }
    #canvas-panel { flex: 1; border-right: 1px solid var(--border); position: relative; overflow: hidden; }
    #dsm-panel { width: 46%; max-width: 720px; display: flex; flex-direction: column; background: var(--bg-elevated); }
    .canvas-viewport {
      width: 100%; height: 100%; overflow: hidden; position: relative; cursor: grab; touch-action: none;
      background-color: var(--bg);
      background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.055) 1px, transparent 0);
    }
    .canvas-viewport.grabbing { cursor: grabbing; }
    #canvas-layer {
      position: absolute; left: 0; top: 0;
      transform-origin: 0 0;
      will-change: transform;
      backface-visibility: hidden;
    }
    #canvas-content { position: relative; }
    .node-wrap {
      position: absolute;
    }
    .node-wrap.is-dragging { z-index: 30; pointer-events: none; }
    .node-wrap.node-wrap--extract { opacity: 0.92; filter: drop-shadow(0 8px 24px rgba(0,0,0,0.45)); }
    .node-wrap.is-selected .node { box-shadow: 0 0 0 1px rgba(255,255,255,0.35); }
    .node-child-wrap.is-dragging { pointer-events: none; z-index: 20; }
    .node {
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--card); display: flex; flex-direction: column; overflow: hidden;
      user-select: none;
    }
    .node.selected { outline: 1px solid var(--primary); outline-offset: 1px; }
    .node.dragging { opacity: 0.35; pointer-events: none; }
    .node.drop-target { box-shadow: 0 0 0 2px rgba(255,255,255,0.2); }
    .node-header {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 6px 10px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.35);
    }
    .node-title { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 13px; font-weight: 500; }
    .node-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .node-icon { display: inline-flex; flex-shrink: 0; }
    .node-icon svg { display: block; shape-rendering: geometricPrecision; }
    .node-controls { display: flex; gap: 2px; opacity: 0; transition: opacity 0.15s; }
    .node:hover .node-controls { opacity: 1; }
    .node-controls button { padding: 2px 4px; border-radius: 4px; font-size: 12px; color: var(--muted); }
    .node-controls button:hover { background: rgba(255,255,255,0.08); color: var(--fg); }
    .node-body { position: relative; display: flex; flex-wrap: wrap; flex: 0 0 auto; align-content: flex-start; align-items: flex-start; gap: 12px; min-height: 72px; padding: 12px; overflow: visible; }
    .node-body--auto { position: relative; }
    .node-child-wrap { position: relative; flex: 0 0 auto; }
    .node-layout-slot {
      flex: 0 0 auto; border-radius: 10px;
      border: 2px dashed rgba(255,255,255,0.28);
      background: rgba(255,255,255,0.05);
      opacity: 0.7;
    }
    .node.node-nested { display: flex; flex-direction: column; overflow: visible; flex: 0 0 auto; height: auto; }
    .node.node-nested .node-header { flex: 0 0 auto; min-height: 36px; box-sizing: border-box; }
    .node.node-nested .node-body {
      flex: 0 0 auto; width: 100%; min-width: 0; max-width: 100%;
      align-self: stretch; box-sizing: border-box;
    }
    .node-square.node { overflow: visible; }
    .node-input {
      width: 100%; background: rgba(255,255,255,0.06); border: 1px solid var(--border-strong);
      border-radius: 6px; color: var(--fg); padding: 2px 6px; font-size: 13px;
    }

    /* Stealth plate — горизонтальный прямоугольник без вложений */
    .node-plate {
      position: relative;
      border-radius: var(--radius-plate);
      background: var(--plate);
      border: 1px solid var(--border-strong);
      display: flex; align-items: center; justify-content: center;
      overflow: visible;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .node-plate::before,
    .node-plate::after {
      content: "";
      position: absolute;
      left: 14px; right: 14px;
      height: 3px;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(255,255,255,0.22) 1px, transparent 1px);
      background-size: 14px 3px;
      background-repeat: repeat-x;
      opacity: 0.55;
    }
    .node-plate::before { top: 7px; }
    .node-plate::after { bottom: 7px; }
    .node-plate-label {
      position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%;
      padding: 12px 18px;
      text-align: center;
    }
    .node-plate-label span {
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      line-height: 1.3; color: var(--primary);
      overflow: hidden; display: -webkit-box;
      -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    }
    .node-plate-input {
      text-align: center; text-transform: uppercase;
      letter-spacing: 0.08em; font-size: 11px; font-weight: 700;
    }
    .node-plate-controls {
      position: absolute; right: 4px; top: 4px; z-index: 2;
      display: flex; gap: 1px; opacity: 0; transition: opacity 0.15s;
    }
    .node-plate:hover .node-plate-controls { opacity: 1; }
    .node-plate-controls button {
      padding: 1px 4px; border-radius: 4px; font-size: 11px; color: var(--muted);
      background: rgba(0,0,0,0.5);
    }
    .node-plate-controls button:hover { color: var(--fg); background: rgba(255,255,255,0.1); }
    .node-plate.kind-function { background: rgba(168, 85, 247, 0.14); border-color: rgba(192, 132, 252, 0.55); }
    .node-plate.kind-function .node-plate-label span { color: #e9d5ff; }
    .node-plate.kind-number { background: rgba(34, 197, 94, 0.14); border-color: rgba(74, 222, 128, 0.55); }
    .node-plate.kind-number .node-plate-label span { color: #bbf7d0; }
    .node-plate.kind-object { background: rgba(249, 115, 22, 0.14); border-color: rgba(251, 146, 60, 0.55); }
    .node-plate.kind-object .node-plate-label span { color: #fed7aa; }
    .node.kind-function { background: rgba(168, 85, 247, 0.1); border-color: rgba(192, 132, 252, 0.45); }
    .node.kind-number { background: rgba(34, 197, 94, 0.1); border-color: rgba(74, 222, 128, 0.45); }
    .node.kind-object { background: rgba(249, 115, 22, 0.1); border-color: rgba(251, 146, 60, 0.45); }
    .ctrl-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; border-radius: 4px;
      font-size: 13px; line-height: 1; color: var(--muted);
    }
    .ctrl-btn:hover { background: rgba(255,255,255,0.1); color: var(--fg); }
    .ctrl-btn.delete:hover { color: #fca5a5; background: rgba(248,113,113,0.15); }

    /* Квадрат — отдельная форма 1:1 */
    .node-square {
      position: relative;
      border-radius: 14px;
      background: linear-gradient(145deg, #1e1e1e 0%, #141414 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex; align-items: center; justify-content: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 2px 8px rgba(0,0,0,0.35);
    }
    .node-square::before {
      content: "";
      position: absolute; inset: 6px;
      border: 1px dashed rgba(255,255,255,0.08);
      border-radius: 10px;
      pointer-events: none;
    }
    .node-square-label {
      position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%; padding: 8px; text-align: center;
    }
    .node-square-label span {
      font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; line-height: 1.25; color: #e5e5e5;
      overflow: hidden; display: -webkit-box;
      -webkit-line-clamp: 4; -webkit-box-orient: vertical;
    }
    .node-square-input {
      text-align: center; text-transform: uppercase;
      letter-spacing: 0.08em; font-size: 9px; font-weight: 700;
    }
    .node-square-controls {
      position: absolute; right: 3px; top: 3px; z-index: 2;
      display: flex; gap: 1px; opacity: 0; transition: opacity 0.15s;
    }
    .node-square:hover .node-square-controls { opacity: 1; }
    .node-square-controls button {
      padding: 1px 3px; border-radius: 4px; font-size: 10px; color: var(--muted);
      background: rgba(0,0,0,0.55);
    }
    .node-square-controls button:hover { color: var(--fg); background: rgba(255,255,255,0.1); }

    #canvas-empty {
      position: absolute; inset: 0; display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px; pointer-events: none;
      color: var(--muted); font-size: 13px;
    }
    #marquee {
      position: absolute; display: none; border: 1px solid var(--primary);
      background: rgba(255,255,255,0.06); pointer-events: none; z-index: 40;
    }
    #drag-preview {
      position: fixed; display: none; z-index: 50; pointer-events: none;
      border: 1px solid var(--border-strong); border-radius: var(--radius-plate);
      background: var(--plate); align-items: center; justify-content: center;
      padding: 12px 18px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      transform-origin: top left;
      box-shadow: 0 12px 32px rgba(0,0,0,0.55);
    }

    /* Нижняя панель — вне viewport, чтобы клики не перехватывались pan/zoom */
    .bottom-dock {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      z-index: 30; pointer-events: auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
      gap: 2px; max-width: calc(100% - 2rem);
      padding: 4px; border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(14, 14, 14, 0.94);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .dock-divider {
      width: 1px; height: 20px; margin: 0 2px;
      background: var(--border); flex-shrink: 0;
    }
    .dock-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 10px; border-radius: 10px;
      font-size: 11px; font-weight: 500; color: var(--muted);
      white-space: nowrap; transition: background 0.12s, color 0.12s;
    }
    .dock-btn:hover { background: var(--primary-dim); color: var(--fg); transform: translateY(-1px); }
    .dock-btn:active { background: rgba(255,255,255,0.12); transform: translateY(0); }
    .dock-btn { transition: background 0.12s, color 0.12s, transform 0.12s; }
    .dock-btn.primary { background: var(--primary); color: #0a0a0a; }
    .dock-btn.primary:hover { background: #e5e5e5; color: #0a0a0a; }
    .dock-btn .dock-icon { font-size: 13px; line-height: 1; opacity: 0.9; }

    .canvas-controls {
      position: absolute; bottom: 16px; right: 16px; display: flex; gap: 2px;
      z-index: 30; pointer-events: auto; padding: 4px; border: 1px solid var(--border); border-radius: 14px;
      background: rgba(14, 14, 14, 0.94); backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .canvas-controls button {
      padding: 7px 10px; border-radius: 10px; color: var(--muted);
      font-size: 14px; transition: background 0.12s, color 0.12s;
    }
    .canvas-controls button:hover { background: var(--primary-dim); color: var(--fg); }
    #zoom-label { min-width: 48px; text-align: center; font-size: 11px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--fg); }

    .dsm-toolbar {
      display: flex; gap: 12px; align-items: center; padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    #dsm-search {
      flex: 1; max-width: 360px; padding: 8px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card); color: var(--fg); font-size: 13px;
    }
    #dsm-search:focus { outline: 1px solid var(--border-strong); }
    .dsm-scroll { flex: 1; overflow: auto; }
    .dsm-table { border-collapse: separate; border-spacing: 0; table-layout: fixed; }
    .dsm-corner, .dsm-col-head, .dsm-row-head, .dsm-cell {
      border-bottom: 1px solid var(--border); border-right: 1px solid var(--border);
    }
    .dsm-corner {
      position: sticky; left: 0; top: 0; z-index: 3; background: var(--card);
      width: 248px; min-width: 248px; font-size: 10px;
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 8px;
      vertical-align: bottom;
    }
    .dsm-col-head {
      position: sticky; top: 0; z-index: 2; background: var(--card);
      vertical-align: bottom; overflow: hidden;
      transition: background 75ms;
    }
    .dsm-col-head.space-head { background: rgba(255,255,255,0.03); }
    .dsm-col-head.hover-col { background: rgba(255,255,255,0.08); }
    .dsm-dlabel-wrap {
      position: relative; width: 100%; height: 100%; overflow: hidden;
    }
    .dsm-dlabel {
      position: absolute; bottom: 4px; left: 50%;
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; line-height: 1; white-space: nowrap;
      transform: translateX(-4px) rotate(-45deg); transform-origin: bottom left;
    }
    .dsm-row-head {
      position: sticky; left: 0; z-index: 1; background: var(--card);
      width: 248px; min-width: 248px; text-align: left; font-weight: normal;
      display: flex; align-items: center; gap: 4px;
      transition: background 75ms;
    }
    .dsm-row-head.space-head { background: rgba(255,255,255,0.03); }
    .dsm-row-head.hover-row { background: rgba(255,255,255,0.08); }
    .dsm-cell { text-align: center; vertical-align: middle; transition: background 75ms; }
    .dsm-cell.diag { background: rgba(255,255,255,0.04); }
    .dsm-cell.space { background: rgba(255,255,255,0.03); cursor: default; }
    .dsm-cell.clickable { cursor: pointer; }
    .dsm-cell.clickable:hover { background: rgba(255,255,255,0.1); }
    .dsm-cell.hover-cross { background: rgba(255,255,255,0.06); }
    .dsm-cell.hover-cross.space { background: rgba(255,255,255,0.05); }
    .dsm-cell.hover-active { background: rgba(255,255,255,0.12); }
    .dsm-cell.hover-active.space { background: rgba(255,255,255,0.08); }
    .dot-sm { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--muted); }
    .dot-direct { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: var(--primary); }
    .dot-agg { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.55); }
    .dsm-label-function { color: #c084fc; }
    .dsm-label-number { color: #4ade80; }
    .dsm-label-object { color: #fb923c; }
    .dot-direct.kind-function { background: #a855f7; }
    .dot-direct.kind-number { background: #22c55e; }
    .dot-direct.kind-object { background: #f97316; }
    .hint { font-size: 11px; color: var(--muted); }
    @media (max-width: 768px) {
      #dsm-panel { width: 100%; max-width: none; }
      .main { flex-direction: column; }
      .dock-btn span.label { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo" aria-hidden="true">⬡</div>
      <nav id="breadcrumb" class="breadcrumb" aria-label="Navigation"></nav>

      <div class="view-switch" role="tablist" aria-label="View mode">
        <button type="button" data-view="canvas">Canvas</button>
        <button type="button" data-view="split" class="active">Split</button>
        <button type="button" data-view="dsm">DSM</button>
      </div>
    </header>

    <div class="main">
      <section id="canvas-panel" class="panel" aria-label="Infinite canvas">
        <div id="canvas-viewport" class="canvas-viewport" data-droppable-id="__root__">
          <div id="canvas-layer">
            <div id="canvas-content"></div>
          </div>
          <div id="canvas-empty">
            <span>Пустая доска</span>
            <span class="hint">R — прямоугольник · E — пространство · F — квадрат · Z — отмена · Space — дублировать</span>
          </div>
          <div id="marquee"></div>
          <div id="drag-preview"></div>
        </div>

        <div class="bottom-dock" role="toolbar" aria-label="Инструменты доски">
          <button type="button" class="dock-btn" data-spawn="SPACE" title="Пространство (E)">
            <span class="dock-icon" aria-hidden="true">⬚</span>
            <span class="label">Space</span><kbd>E</kbd>
          </button>
          <button type="button" class="dock-btn" data-spawn="RECTANGLE" title="Прямоугольник (R)">
            <span class="dock-icon" aria-hidden="true">▭</span>
            <span class="label">Rect</span><kbd>R</kbd>
          </button>
          <button type="button" class="dock-btn" data-spawn="SQUARE" title="Квадрат (F)">
            <span class="dock-icon" aria-hidden="true">◻</span>
            <span class="label">Square</span><kbd>F</kbd>
          </button>

          <div class="dock-divider" aria-hidden="true"></div>

          <button type="button" class="dock-btn" id="btn-undo" title="Отменить (Z / Ctrl+Z)">
            <span class="dock-icon" aria-hidden="true">↶</span>
            <span class="label">Undo</span><kbd>Z</kbd>
          </button>
          <button type="button" class="dock-btn" id="btn-duplicate" title="Дублировать (Space)">
            <span class="dock-icon" aria-hidden="true">⧉</span>
            <span class="label">Dup</span><kbd>␣</kbd>
          </button>
          <button type="button" class="dock-btn" id="btn-delete" title="Удалить (Del)">
            <span class="dock-icon" aria-hidden="true">×</span>
            <span class="label">Del</span>
          </button>

          <div class="dock-divider" aria-hidden="true"></div>

          <button type="button" class="dock-btn" id="btn-import" title="Импорт">
            <span class="dock-icon" aria-hidden="true">↑</span>
            <span class="label">Import</span>
          </button>
          <button type="button" class="dock-btn primary" id="btn-export" title="Экспорт">
            <span class="dock-icon" aria-hidden="true">↓</span>
            <span class="label">Export</span>
          </button>

          <div class="dock-divider" aria-hidden="true"></div>

          <button type="button" class="dock-btn" id="btn-recenter" title="Центр доски">
            <span class="dock-icon" aria-hidden="true">◎</span>
            <span class="label">Центр</span>
          </button>
        </div>

        <div class="canvas-controls">
          <button type="button" id="btn-zoom-out" aria-label="Zoom out" title="Отдалить (−)">−</button>
          <button type="button" id="btn-zoom-reset" aria-label="Reset zoom" title="100% (0)"><span id="zoom-label">100%</span></button>
          <button type="button" id="btn-zoom-in" aria-label="Zoom in" title="Приблизить (+)">+</button>
        </div>
      </section>

      <section id="dsm-panel" class="panel" aria-label="Dependency matrix">
        <div class="dsm-toolbar">
          <input id="dsm-search" type="search" placeholder="Фильтр по названию…" />
          <span class="hint">■ direct · ○ aggregate</span>
        </div>
        <div id="dsm-wrap" class="dsm-scroll thin-scroll"></div>
      </section>
    </div>
  </div>
